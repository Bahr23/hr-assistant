        items:
          type: array
          description: Упорядоченные вопросы.
          items: {$ref: '#/components/schemas/Question'}
    Error:
      type: object
      description: Единый формат ошибки API.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Стабильный машинный код ошибки.
              example: validation_failed
            message:
              type: string
              description: Понятное человеку описание ошибки.
              example: must not be empty
            request_id:
              type: string
              description: Идентификатор запроса для сопоставления с логами.
              example: 8fc49c2b2f56/request-000006
            details:
              type: object
              description: Дополнительный контекст, например ошибочное поле.
              additionalProperties: true
              example: {field: title}
