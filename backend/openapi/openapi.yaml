openapi: 3.1.0
info:
  title: HR Assistant Backend API
  version: 1.0.0
  description: |
    REST API личного кабинета HR для управления вакансиями и вопросами
    асинхронного интервью.

    ## Авторизация

    После регистрации или входа API возвращает короткоживущий `access_token`.
    Передавайте его в защищённые запросы как `Authorization: Bearer <token>`.
    Долгоживущий refresh-токен хранится в cookie `hr_refresh`; Postman сохраняет
    эту cookie автоматически. Запрос `/auth/refresh` ротирует refresh-токен и
    возвращает новую пару авторизационных данных.

    ## Вакансии

    HR видит и изменяет только собственные вакансии. Чужой или отсутствующий
    ресурс возвращается как `404`. Новая вакансия создаётся сразу активной.
    Для публикации нужны обязательные поля, будущий срок действия и хотя бы один
    вопрос. Публикация создаёт публичную ссылку интервью; архивирование отключает её.

    ## Ошибки

    Все ошибки имеют единый объект `error` с машинным `code`, сообщением и
    `request_id`, который можно использовать для поиска запроса в логах.

    Раздел кандидатов содержит завершённые интервью и ответы только по
    вакансиям текущего HR-пользователя.
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный backend, запущенный через Docker Compose
tags:
  - name: Auth
    description: Регистрация HR, управление сессией и получение текущего пользователя.
  - name: Vacancies
    description: CRUD вакансий, публикация, архивирование и управление публичной ссылкой.
  - name: Questions
    description: Упорядоченный список обязательных вопросов с текстовым или голосовым ответом.
  - name: Candidates
    description: Завершённые интервью кандидатов и их ответы.
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Зарегистрировать HR
      description: |
        Создаёт HR-пользователя и сразу открывает сессию. Email нормализуется
        перед сохранением и должен быть уникальным. Access JWT возвращается в JSON,
        refresh JWT устанавливается в HttpOnly cookie `hr_refresh`.
      requestBody:
        required: true
        description: Данные нового HR-пользователя.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: HR создан и авторизован; refresh JWT установлен в cookie.
          headers:
            Set-Cookie: {$ref: '#/components/headers/RefreshCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Войти в личный кабинет
      description: Проверяет email и пароль, создаёт новую сессию и устанавливает refresh cookie.
      requestBody:
        required: true
        description: Учётные данные HR.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Успешный вход; refresh JWT установлен в cookie.
          headers:
            Set-Cookie: {$ref: '#/components/headers/RefreshCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Обновить токены
      description: |
        Использует cookie `hr_refresh`, ротирует refresh-токен и возвращает новый
        access-токен. Повторное использование уже ротированного refresh-токена
        отзывает соответствующую сессию.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Access JWT обновлён, refresh JWT ротирован.
          headers:
            Set-Cookie: {$ref: '#/components/headers/RefreshCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Завершить сессию
      description: Отзывает текущую сессию и удаляет refresh cookie.
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Сессия отозвана, refresh cookie удалена.
          headers:
            Set-Cookie: {$ref: '#/components/headers/RefreshCookie'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/me:
    get:
      tags: [Auth]
      operationId: me
      summary: Получить текущего HR
      description: Возвращает профиль пользователя из действующей access-сессии.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Текущий HR.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /vacancies:
    get:
      tags: [Vacancies]
      operationId: listVacancies
      summary: Получить список вакансий
      description: Возвращает страницу вакансий текущего HR, при необходимости отфильтрованную по статусу.
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: status
          description: Вернуть только вакансии с указанным статусом.
          schema: {$ref: '#/components/schemas/VacancyStatus'}
        - in: query
          name: limit
          description: Максимальное количество вакансий в ответе.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: offset
          description: Количество вакансий, пропускаемых от начала списка.
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Вакансии текущего HR.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VacancyList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Vacancies]
      operationId: createVacancy
      summary: Создать вакансию
      description: |
        Атомарно создаёт активную вакансию вместе с вопросами и публичной Telegram-ссылкой.
        При ошибке ни вакансия, ни вопросы не сохраняются.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        description: Полностью заполненная вакансия и хотя бы один вопрос.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VacancyCreate'}
      responses:
        '201':
          description: Создана активная вакансия.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vacancy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /vacancies/{vacancyId}:
    parameters:
      - $ref: '#/components/parameters/VacancyId'
    get:
      tags: [Vacancies]
      operationId: getVacancy
      summary: Получить вакансию
      description: Возвращает вакансию вместе с вопросами в их текущем порядке.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Вакансия с вопросами.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Vacancy'
                  - type: object
                    required: [questions]
                    properties:
                      questions:
                        type: array
                        items: {$ref: '#/components/schemas/Question'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
    patch:
      tags: [Vacancies]
      operationId: updateVacancy
      summary: Изменить вакансию
      description: |
        Частично изменяет переданные поля вакансии. Отсутствующие поля остаются
        без изменений. Для nullable-полей явный `null` очищает значение.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        description: Только изменяемые поля вакансии.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VacancyPatch'}
      responses:
        '200':
          description: Вакансия обновлена.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Vacancy'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /vacancies/{vacancyId}/archive:
    parameters: [{$ref: '#/components/parameters/VacancyId'}]
    post:
      tags: [Vacancies]
      operationId: archiveVacancy
      summary: Архивировать вакансию
      description: Переводит опубликованную вакансию в `archived` и немедленно отключает публичную ссылку.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VacancyActionOK'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /vacancies/{vacancyId}/restore:
    parameters: [{$ref: '#/components/parameters/VacancyId'}]
    post:
      tags: [Vacancies]
      operationId: restoreVacancy
      summary: Вернуть вакансию в активные
      description: Переводит архивную вакансию в `published` и создаёт новую Telegram-ссылку.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VacancyActionOK'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /vacancies/{vacancyId}/link/rotate:
    parameters: [{$ref: '#/components/parameters/VacancyId'}]
    post:
      tags: [Vacancies]
      operationId: rotateVacancyLink
      summary: Перевыпустить публичную ссылку
      description: Создаёт новую ссылку опубликованной вакансии; предыдущая сразу становится недействительной.
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/VacancyActionOK'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /vacancies/{vacancyId}/questions:
    parameters: [{$ref: '#/components/parameters/VacancyId'}]
    get:
      tags: [Questions]
      operationId: listQuestions
      summary: Получить вопросы вакансии
      description: Возвращает вопросы по возрастанию поля `position`.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Упорядоченные вопросы.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionList'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
    post:
      tags: [Questions]
      operationId: createQuestion
      summary: Добавить вопрос
      description: Добавляет обязательный вопрос с выбранным форматом ответа в конец текущего списка.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        description: Текст нового вопроса.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuestionInput'}
      responses:
        '201':
          description: Вопрос добавлен в конец списка.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Question'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /vacancies/{vacancyId}/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/VacancyId'
      - $ref: '#/components/parameters/QuestionId'
    patch:
      tags: [Questions]
      operationId: updateQuestion
      summary: Изменить вопрос
      description: Изменяет формулировку и формат ответа, сохраняя текущую позицию вопроса.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        description: Новый текст вопроса.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuestionInput'}
      responses:
        '200':
          description: Вопрос обновлён.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Question'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
    delete:
      tags: [Questions]
      operationId: deleteQuestion
      summary: Удалить вопрос
      description: |
        Удаляет вопрос и атомарно уплотняет позиции оставшихся вопросов.
        У опубликованной вакансии нельзя удалить последний вопрос.
      security: [{bearerAuth: []}]
      responses:
        '204':
          description: Вопрос удалён, позиции уплотнены.
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /vacancies/{vacancyId}/questions/order:
    parameters: [{$ref: '#/components/parameters/VacancyId'}]
    put:
      tags: [Questions]
      operationId: reorderQuestions
      summary: Изменить порядок вопросов
      description: |
        Принимает полный список ID всех вопросов вакансии в новом порядке.
        Проверка состава и запись позиций выполняются атомарно.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        description: Полный упорядоченный список ID вопросов данной вакансии.
        content:
          application/json:
            schema:
              type: object
              required: [question_ids]
              properties:
                question_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  description: Все ID вопросов вакансии, перечисленные ровно по одному разу.
                  items: {type: string, format: uuid}
              example:
                question_ids:
                  - 7d444842-9dc0-11d1-b245-5ffdce74fad2
                  - 7d444841-9dc0-11d1-b245-5ffdce74fad2
      responses:
        '200':
          description: Новый порядок сохранён атомарно.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuestionList'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /vacancies/public/{publicToken}:
    get:
      tags: [Vacancies]
      operationId: getVacancyWelcomeMessage
      summary: Получить приветствие активной вакансии
      description: REST endpoint для Telegram-бота. Принимает master-токен или обычный access JWT. Неактивная, просроченная или неизвестная ссылка возвращает `404`.
      security: [{masterToken: []}, {bearerAuth: []}]
      parameters:
        - in: path
          name: publicToken
          required: true
          description: Токен из Telegram deep link.
          schema: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$'}
        - in: query
          name: telegram_user_id
          required: true
          description: Telegram user ID кандидата, для которого проверяется доступность попытки.
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Приветствие вакансии и доступность попытки кандидата.
          content:
            application/json:
              schema:
                type: object
                required: [welcome_message, already_attempted, description]
                properties:
                  description: {type: [string, 'null'], maxLength: 10000}
                  welcome_message: {type: string}
                  already_attempted: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /candidates:
    get:
      tags: [Candidates]
      operationId: listCandidates
      summary: Получить завершённые интервью кандидатов
      description: Возвращает только завершённые интервью по вакансиям текущего HR.
      security: [{bearerAuth: []}]
      parameters:
        - in: query
          name: search
          description: Поиск без учёта регистра по имени, фамилии или Telegram username.
          schema: {type: string, maxLength: 100}
        - in: query
          name: vacancy_id
          description: Вернуть интервью только по указанной вакансии.
          schema: {type: string, format: uuid}
        - in: query
          name: limit
          description: Максимальное количество интервью в ответе.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: offset
          description: Количество интервью, пропускаемых от начала списка.
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Страница завершённых интервью текущего HR.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateInterviewList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /candidates/{sessionId}/answers/{answerId}/evaluation/retry:
    post:
      tags: [Candidates]
      operationId: retryAnswerEvaluation
      summary: Повторить неуспешную проверку ответа
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: {type: string, format: uuid}
        - in: path
          name: answerId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: {type: integer, minimum: 1, description: Версия неуспешной проверки; повторный запрос идемпотентен.}
      responses:
        '202':
          description: Повторная проверка поставлена в очередь.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: {type: integer, minimum: 1}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /candidates/{sessionId}:
    get:
      tags: [Candidates]
      operationId: getCandidate
      summary: Получить завершённое интервью кандидата
      description: Возвращает профиль кандидата, данные вакансии и ответы в порядке вопросов.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: sessionId
          required: true
          description: UUID завершённой сессии интервью.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Завершённое интервью кандидата.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateInterviewDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /evaluation-criteria/templates:
    get:
      tags: [Vacancies]
      operationId: listEvaluationCriterionTemplates
      summary: Получить каталог критериев оценки
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Версионируемый каталог шаблонов.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvaluationCriterionCatalog'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /candidates/{sessionId}/report/rebuild:
    post:
      tags: [Candidates]
      operationId: rebuildCandidateReport
      summary: Пересобрать общий отчёт
      description: Новая версия заменяет отображаемый отчёт только после успешной валидации. Повтор с той же наблюдаемой версией идемпотентен.
      security: [{bearerAuth: []}]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: {type: integer, minimum: 0, maximum: 2147483646}
      responses:
        '202':
          description: Сборка отчёта запрошена.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: {type: integer, minimum: 1}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT из ответа регистрации, входа или обновления токенов.
    refreshCookie:
      type: apiKey
      in: cookie
      name: hr_refresh
